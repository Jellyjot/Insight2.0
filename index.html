<body>
<div class="app">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="3" fill="none" stroke="#fff" stroke-width="2"/><polyline points="6,22 12,14 17,19 25,8" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="25" cy="8" r="2.4" fill="#fcbe04"/><circle cx="6" cy="22" r="2.2" fill="#6cc070"/></svg>insight</div>
    <span class="mock">Mock-up</span><span class="savestate" id="savestate"></span>
    <label class="plabel" for="psel">Persona</label><select id="psel" class="psel"></select>
    <div class="states" role="group" aria-label="Point in time" id="states"></div>
    <span class="bk" id="bk" hidden><button class="bkbtn" data-act="backup">Back up</button><button class="bkbtn" data-act="restore">Restore</button><input type="file" id="bkfile" accept=".json,application/json" hidden></span>
    <button class="drawerbtn" id="drawerbtn" aria-expanded="false" aria-controls="drawer">Changes and decisions</button>
  </header>
  <nav class="side" aria-label="Views">
    <div class="who"><div class="av">CW</div><div><b>Claire Williams</b><small>Last data refresh: 17 Sep 2026</small><small>Environment: Mock-up</small></div></div>
    <div class="search">Search for people…</div>
    <div class="nav" id="nav"></div>
    <div class="filters" id="filters"></div>
  </nav>
  <main class="canvas" id="canvas"></main>
  <div class="flash" id="flash" role="status" hidden></div>
</div>
<aside class="drawer" id="drawer" aria-label="Changes and decisions">
  <div class="tabs" role="group" aria-label="Panel"><button data-tab="C" aria-pressed="true">Changes</button><button data-tab="D" aria-pressed="false">Decisions</button><button data-tab="T" aria-pressed="false">Tile</button><button data-tab="A" aria-pressed="false">Add tile</button><button data-tab="V" aria-pressed="false">View</button></div>
  <div id="panel"></div>
</aside>
<script>
/* ---------- decisions (numbering matches the sign-off deck) ---------- */
/* ---------- personas (view access per the persona access table; draft to confirm) ---------- */
const V_ALL=['global','mgmt','client','billing','pp','npp','ep','cp','mp','ops','fe'];
const V_LEAD=V_ALL.filter(x=>x!=='billing');
const V_TP=V_LEAD.filter(x=>x!=='global');
const PERSONAS=[
 {id:'gexec',name:'Global Executive / Finance Committee',views:V_LEAD},
 {id:'gvh',name:'Global Vertical Heads',views:V_LEAD},
 {id:'ggh',name:'Global Group Heads',views:V_LEAD},
 {id:'igh',name:'International Group Heads',views:V_LEAD},
 {id:'cgh',name:'Country Group Heads',views:V_LEAD},
 {id:'ch',name:'Country Heads',views:V_LEAD},
 {id:'tp',name:'Trading Partner',views:V_TP},
 {id:'felm',name:'Fee Earners with line management',views:['ops','fe']},
 {id:'fe',name:'Fee Earners',views:['fe']},
 {id:'sec',name:'Secretaries',views:V_TP},
 {id:'fbp',name:'Finance Business Partners',views:V_LEAD},
 {id:'lfm',name:'Local Finance Managers',views:V_LEAD},
 {id:'gfl',name:'Global Finance Leadership',views:V_ALL}
];
let persona=null;
function personaCounts(P,st){ const c={R:0,M:0,N:0,X:0,Q:0,DT:0,decs:new Set()}; if(st==='today') return c;
  P.views.forEach(id=>{ const v=VIEWS.find(x=>x.id===id); if(!v) return;
    if(v.kind==='table'){ changes(v,st).forEach(x=>{ if(x.c==='D'){ c.DT++; const m=x.x.match(/D(\d+)/); if(m) c.decs.add(m[1]) } else if(c[x.c]!==undefined&&!x.x.startsWith('Filter')) c[x.c]++ }); return }
    v.tiles.forEach(t=>{ const r=resolve(t,st); if(!r) return; const codes=new Set(r.tags.map(g=>g[0])); const d=t[st]&&t[st].dec;
      if(d&&!REC[String(d.id)]&&getOpt(String(d.id))==='both'){ c.DT++; c.decs.add(String(d.id)); codes.delete('R') }
      ['R','M','N','X','Q'].forEach(k=>{ if(codes.has(k)) c[k]++ }) });
    if(v.side&&v.side[st]) v.side[st].tags.forEach(([k])=>{ if(c[k]!==undefined) c[k]++ });
    if(v.nameB&&st==='jan'){ c.decs.add('9') } });
  c.D=c.decs.size; return c }
function personaBanner(v,st){
  const P=PERSONAS.find(p=>p.id===persona); if(!P) return '';
  const c=personaCounts(P,st), inSet=P.views.includes(v.id), noAcc=VIEWS.filter(x=>!P.views.includes(x.id)).map(x=>viewName(x).n);
  const parts=[['R','renamed'],['M','calculated differently'],['N','new'],['X','removed']].filter(([k])=>c[k]).map(([k,l])=>`${c[k]} ${l}`);
  const open=c.D;
  return `<div class="persona">
    <div class="p-top"><b>${esc(P.name)}</b><span class="chip c-P">${P.views.length} of ${VIEWS.length} views</span><span class="p-uses">${!noAcc.length?'Access to all views':P.views.length*2<=VIEWS.length?'Access: '+esc(P.views.map(id=>viewName(VIEWS.find(x=>x.id===id)).n).join(', ')):'No access: '+esc(noAcc.join(', '))}</span></div>
    ${st!=='today'?`<div class="p-count">Tiles across their views: ${parts.length?parts.join(', '):'no changes'}${c.DT?`; ${c.DT} more depend on open decisions (${[...c.decs].sort((a,b)=>a-b).map(d=>'D'+d).join(', ')})`:''}${c.Q?`; ${c.Q} with open questions`:''}.</div>`:''}
    <div class="p-note">View access per the persona access table (draft, to confirm).</div>
    ${inSet?'':`<div class="p-warn">This persona does not have access to this view (${P.views.map(id=>esc(viewName(VIEWS.find(x=>x.id===id)).n)).join(', ')}).</div>`}
  </div>` }
const DEC={
 1:{name:'Rename timing',q:'Fees Billed and Billing Realisation names in January',a:'Rename from 1 January',b:'Keep International names until later',views:'6 views',draft:'Confirm with FLT; if frozen, rename in Global view only'},
 2:{name:'Partner and fee earner views',q:'The proposal keeps partner rem and fee earner bonus on International metrics',a:'Keep International names',b:'Use global names',views:'Partner Perf., Fee Earner',draft:'Keep International names; show global name in tile help'},
 3:{name:'Lawyer Hours per Day day basis',q:'The proposal uses local business days; the earlier recommendation was a flat 260-day basis',a:'Local business days (proposed definition)',b:'Flat 260-day basis',views:'Mgmt, Global, Ops, Fee Earner',draft:'Confirm day basis before January build'},
 4:{name:'Production headline',q:'Which production tile leads the Management view',a:'Production Value (all fee earners)',b:'Lawyer Production Value',views:'Management, Global',draft:'Confirm population; label clearly'},
 5:{name:'AR attribution',q:'Global AR is on a fee earner basis',a:'By Engagement Partner',b:'By Fee Earner',views:'Mgmt, Client, EP, CP, Partner Perf.',draft:'Global view fee earner; partner views keep EP'},
 6:{name:'Lockup',q:'Lockup Days is not in the proposed metric set',a:'Lockup headline, WIP and AR days beneath',b:'WIP and AR days only',views:'Management, Global, EP, CP',draft:'Lockup value headline; WIP and AR days beneath'},
 7:{name:'US referral tiles',q:'Not in the proposal',a:'Cross-region Referrals Out and In',b:'Keep US referral tiles',views:'Partner Performance',draft:'Adopt as a rename, not a removal'},
 8:{name:'P Score',q:'The proposal keeps partner rem on International metrics',a:'International partners only',b:'All partners',views:'EP, CP, Matter Manager',draft:'Keep for International partners, if rem stays International'},
 9:{name:'Client Partner view name',q:'Matter Partner → Matter Manager is recommended; Client Partner is still open',a:'Client Partner',b:'Client Relationship Partner',views:'Client Partner',draft:'Test with US stakeholders'},
 10:{name:'Global client de-duplication',q:'Rule for fees and disbursements duplicated across regions in a global client view',a:'Define a de-duplication rule before go-live',b:'Keep the Client view International only for now',views:'Client',draft:'Define with Finance data owners'}
};
const STATES=[['today','Today'],['jan','1 January 2027'],['end','End state']];

/* ---------- state resolution ---------- */
const ORDER=['today','jan','end'];
function resolve(tile,st){
  const r=resolve0(tile,st); const v=tile.__v; if(!r||!v||!v.role||ORDER.indexOf(st)<ORDER.indexOf(v.role.state)) return r;
  const {from,to}=v.role; const t0=r.t; r.t=r.t.split(from).join(to); if(r.orT) r.orT=r.orT.split(from).join(to);
  if(st===v.role.state&&r.t!==t0&&!r.tags.some(g=>g[0]==='R')) r.tags=[...r.tags,['R','recommended']];
  return r;
}
function resolve0(tile,st){
  let r=null, tags=[], dec=null;
  for(const s of ORDER.slice(0,ORDER.indexOf(st)+1)){
    const o=tile[s]; if(!o) continue;
    const {tags:tg,dec:dc,...rest}=o;
    if(r===null) r={}; if(rest.t&&s!=='today') delete r.carry; Object.assign(r,rest);
    if(s===st){tags=tg||[];dec=dc||null}
    else if(dc){ // carry an earlier decision forward, untagged
      const ch=opt[dc.id]==='b'?dc.b:dc.a; const {tags:_t,...cr}=ch; Object.assign(r,cr);
      if(opt[dc.id]==='both'&&s!==st){r.carry=dc}
    }
  }
  if(!r||r.hide&&!dec) return null;
  r={...r,tags:[...tags]};
  if(dec){
    const mode=opt[dec.id], A={...dec.a}, B={...dec.b};
    const aT=A.t||r.t, bT=B.t||r.t;
    if(mode==='a'||mode==='b'){const ch=mode==='a'?A:B; if(ch.hide) return null; const {tags:ct,...cr}=ch; Object.assign(r,cr); r.tags=[...r.tags,...(ct||[])]; delete r.hide;}
    else{
      if(A.hide&&!B.hide){r.onlyB=true}
      else if(B.hide&&!A.hide){r.dNote=`Option B removes this tile`}
      const {tags:at,...Ar}=A; Object.assign(r,Ar); delete r.hide; r.tags=[...r.tags,...(at||[])];
      if(!A.hide&&!B.hide&&bT!==aT) r.orT=bT;
      if(A.note||B.note) r.dNote=`A: ${A.note||'—'}  B: ${B.note||'—'}`;
      if(B.v&&B.v!==r.v) r.orV=B.v;
    }
    r.dec=dec.id;
  }
  if(r.carry&&!dec){ const c=r.carry; if(c.b.t&&c.b.t!==r.t) r.orT=c.b.t; if(c.b.hide) r.dNote='Option B removes this tile'; if(c.a.note) r.dNote=`A: ${c.a.note}  B: ${c.b.note}`; r.dec=c.id; }
  return r;
}

const SB_TABLE='mockup_docs';
function sbReady(){ return !!(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase&&window.supabase.createClient) }
function makeSupabaseDB(){
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const cache={}, subs=[]; let loaded=false, loading=null;
  const col=c=>cache[c]||(cache[c]=new Map());
  const snap=(c,order,dir)=>{ let docs=[...col(c).entries()].map(([id,data])=>({id,data:()=>data}));
    if(order) docs.sort((a,b)=>{const x=a.data()[order]??'', y=b.data()[order]??''; return (x<y?-1:x>y?1:0)*(dir==='desc'?-1:1)}); return {docs} };
  const notify=c=>subs.filter(s=>s.c===c).forEach(s=>{ try{ s.cb(snap(c,s.order,s.dir)) }catch(e){ console.error(e) } });
  async function loadAll(){ if(loaded) return; if(loading) return loading;
    loading=(async()=>{ const {data,error}=await sb.from(SB_TABLE).select('collection,id,data'); if(error) throw error;
      (data||[]).forEach(r=>col(r.collection).set(r.id,r.data||{})); loaded=true;
      sb.channel('mockup-live').on('postgres_changes',{event:'*',schema:'public',table:SB_TABLE},pl=>{
        if(pl.eventType==='DELETE'){ const o=pl.old||{}; if(o.collection){ col(o.collection).delete(o.id); notify(o.collection) } }
        else { const n=pl.new; col(n.collection).set(n.id,n.data||{}); notify(n.collection) } }).subscribe() })();
    return loading }
  function query(c,order,dir){ return {
    orderBy:(f,d)=>query(c,f,d),
    onSnapshot(cb,err){ const s={c,order,dir,cb}; subs.push(s); loadAll().then(()=>cb(snap(c,order,dir))).catch(e=>{ console.error(e); err&&err(e) }); return ()=>{ const i=subs.indexOf(s); if(i>=0) subs.splice(i,1) } },
    async add(data){ const id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)); await docRef(c+'/'+id).set(data); return {id} } } }
  function docRef(path){ const i=path.indexOf('/'), c=path.slice(0,i), id=path.slice(i+1);
    const write=async data=>{ const prev=col(c).get(id); col(c).set(id,data); notify(c);
      const {error}=await sb.from(SB_TABLE).upsert({collection:c,id,data,updated_at:new Date().toISOString()}); if(error){ if(prev===undefined) col(c).delete(id); else col(c).set(id,prev); notify(c); throw error } };
    return { set:data=>write(data), update:data=>write({...(col(c).get(id)||{}),...data}),
      async delete(){ const prev=col(c).get(id); col(c).delete(id); notify(c); const {error}=await sb.from(SB_TABLE).delete().eq('collection',c).eq('id',id); if(error){ if(prev!==undefined){ col(c).set(id,prev); notify(c) } throw error } } } }
  return {collection:c=>query(c), doc:docRef}
}

/* ---------- tile order ---------- */
function baseKeys(v){ return [...v.tiles.map((t,i)=>`${v.id}-${i}`), ...EDITS.filter(e=>e.type==='add'&&e.view===v.id).sort((a,b)=>(a.at||'').localeCompare(b.at||'')).map(e=>'add-'+e.id)] }
function getOrder(v){ const base=baseKeys(v), L=LAYOUT[v.id]; if(!L||!Array.isArray(L.order)) return base;
  const rk=k=>{const i=L.order.indexOf(k); return i<0?1000+base.indexOf(k):i}; return base.slice().sort((a,b)=>rk(a)-rk(b)) }
function renderKey(v,key,st){
  if(key.startsWith('add-')){ const e=EDITS.find(x=>x.id===key.slice(4)); if(!e||ORD(e.state)>ORD(st)) return null;
    const r=addedR(e,st); return r?tileHTML(r,null,key):null }
  const i=+key.split('-').pop(), t=v.tiles[i]; if(!t) return null; const r=applyEdits(resolve(t,st),v.id,key,st); return r?tileHTML(r,t,key):null }
function isVisible(v,key,st){ return !!renderKey(v,key,st) }
function act_layout(vid,order){ const d={order,by:ME.id,at:nowISO()}; return save(()=>DB.doc(`layout/${vid}`).set(d),()=>{LAYOUT[vid]=d}) }
function moveTo(v,key,target,after){ if(key===target) return; const ord=getOrder(v).filter(k=>k!==key); let i=ord.indexOf(target); if(i<0) return; if(after) i++; ord.splice(i,0,key); return act_layout(v.id,ord) }
function moveBy(v,key,dir){ const vis=getOrder(v).filter(k=>isVisible(v,k,cur.state)); const i=vis.indexOf(key), j=i+dir; if(i<0||j<0||j>=vis.length){flash(dir<0?'Already first':'Already last'); return} return moveTo(v,key,vis[j],dir>0) }
document.addEventListener('dragstart',e=>{ const t=e.target.closest&&e.target.closest('.tile[data-key]'); if(!t) return; dragKey=t.dataset.key; t.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',dragKey)}catch(_){} });
document.addEventListener('dragend',()=>{ dragKey=null; document.querySelectorAll('.dragging,.drop-before,.drop-after').forEach(x=>x.classList.remove('dragging','drop-before','drop-after')) });
document.addEventListener('dragover',e=>{ if(!dragKey) return; const t=e.target.closest&&e.target.closest('.tile[data-key]'); document.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after')); if(!t||t.dataset.key===dragKey) return; e.preventDefault(); const rc=t.getBoundingClientRect(); t.classList.add(e.clientX>rc.left+rc.width/2?'drop-after':'drop-before') });
document.addEventListener('drop',async e=>{ if(!dragKey) return; const t=e.target.closest&&e.target.closest('.tile[data-key]'); if(!t) return; e.preventDefault(); const rc=t.getBoundingClientRect(); const after=e.clientX>rc.left+rc.width/2; const k=dragKey; dragKey=null; await moveTo(findView(cur.view),k,t.dataset.key,after); renderAll() });

async function exportLog(){
  const ids=[...new Set([...Object.values(REC).map(r=>r.by),...COMMENTS.map(c=>c.by),...EDITS.map(e=>e.by)].filter(x=>x&&x!=='local'))];
  const ps=USER&&ids.length?await USER.profiles(ids):{}; const nm=id=>id==='local'?'Me':(ps[id]&&ps[id].name)||'Someone';
  let t=`# Insight mock-up: decision log\n\nExported ${fmt(nowISO())}\n\n## Decisions\n\n`;
  allDecs().forEach(d=>{const k=d.k; const r=REC[k]; t+=`### D${d.num} ${d.name}${d.custom?' (proposed in mock-up)':''}\n\n${d.q?`- Question: ${d.q}\n`:''}${d.views?`- Views: ${d.views}\n`:''}${d.draft?`- Draft position: ${d.draft}\n`:''}- Option A: ${d.a}\n- Option B: ${d.b}\n- Status: ${r?`Agreed, option ${r.choice.toUpperCase()} (${nm(r.by)}, ${fmt(r.at)})`:'Open'}\n`;
    COMMENTS.filter(c=>c.target==='dec:'+k).forEach(c=>t+=`- Comment, ${nm(c.by)}, ${fmt(c.at)}: ${c.text}\n`); t+='\n'});
  t+=`## Proposed tile changes\n\n`;
  const vn=id=>(findView(id)||{}).name||id; const sn=s=>s==='jan'?'1 January':'End state';
  EDITS.slice().sort((a,b)=>(a.view+a.state).localeCompare(b.view+b.state)).forEach(e=>{ let base='';
    if(e.type!=='add'){const v=findView(e.view); const tt=v&&tileByKey(v,e.tile,e.state); base=tt&&tt.base?tt.base.t:e.tile}
    t+=`- ${vn(e.view)}, ${sn(e.state)}: ${e.type==='add'?`new tile "${e.title}"${e.value?` (${e.value})`:''}${e.note?`, ${e.note}`:''}${(()=>{const L=e.dec&&allDecs().find(d=>d.k===e.dec.k); return L?`, depends on D${L.num} ${L.name} (option B: ${e.dec.bMode==='rename'?`named "${e.dec.bTitle}"`:'not added'})`:''})()}`:e.type==='rename'?`rename "${base}" to "${e.title}"`:e.type==='orname'?`option B name on "${base}": "${e.orig}" → "${e.text}"`:e.type==='qadd'?`open question added on "${base}": ${e.text}`:e.type==='qedit'?(e.removed?`open question removed on "${base}": ${e.orig}`:`open question edited on "${base}": "${e.orig}" → "${e.text}"`):`remove "${base}"`} (${nm(e.by)})\n`;
    (e.questions||[]).forEach(q=>t+=`  - Open question: ${q.text}\n`);
    COMMENTS.filter(c=>c.target===`tile:${e.view}:${e.type==='add'?'add-'+e.id:e.tile}`).forEach(c=>t+=`  - Comment, ${nm(c.by)}: ${c.text}\n`) });
  const tc=COMMENTS.filter(c=>c.target.startsWith('tile:')&&!EDITS.some(e=>c.target===`tile:${e.view}:${e.type==='add'?'add-'+e.id:e.tile}`));
  if(CUSTOM.length){ t+=`\n## Proposed new views\n\n`; CUSTOM.forEach(c=>{ const vid='cv-'+c.id; const tl=EDITS.filter(e=>e.type==='add'&&e.view===vid); t+=`- ${c.name}, from ${sn(c.state)}, ${c.cols} columns (${nm(c.by)})${c.note?`: ${c.note}`:''}\n`; tl.forEach(e=>t+=`  - Tile: ${e.title}${e.value?` (${e.value})`:''}${e.note?`, ${e.note}`:''}\n`) }) }
  const lv=Object.entries(LAYOUT); if(lv.length){ t+=`\n## Tile order changes\n\n`; lv.forEach(([vid,l])=>t+=`- ${vn(vid)}: tiles reordered (${nm(l.by)}, ${fmt(l.at)})\n`) }
  if(tc.length){ t+=`\n## Other tile comments\n\n`; tc.forEach(c=>{const [,vid,key]=c.target.split(':'); const v=findView(vid); const tt=v&&tileByKey(v,key,'jan'); t+=`- ${vn(vid)}, ${tt&&tt.r?tt.r.t:key}: ${c.text} (${nm(c.by)})\n`}) }
  if(DL){ try{ await DL.save({filename:'insight-decision-log.md',data:t}) }catch(e){ if(e&&e.code!=='declined') flash('Download not available here') } return }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([t],{type:'text/markdown'})); a.download='insight-decision-log.md'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove()},500)
}

    else if(a==='newdec'){ linkAfterDec=sel.key; tab='D'; renderAll(); const fm=document.getElementById('newdecform'); if(fm) fm.scrollIntoView({block:'start'}); return }
    renderAll() }
  else if(a==='gonewdec'){ if(editBase||editDec){ editBase=null; editDec=null; ['nd-n','nd-q','nd-a','nd-b','nd-v','nd-d'].forEach(x=>delete drafts[x]); renderAll() } const fm=document.getElementById('newdecform'); if(fm){ fm.scrollIntoView({block:'start'}); const i=document.getElementById('nd-n'); if(i) i.focus() } }
  else if(a==='editbdec'){ editBase=b.dataset.k; editDec=null; linkAfterDec=null; ['nd-n','nd-q','nd-a','nd-b','nd-v','nd-d'].forEach(x=>delete drafts[x]); renderAll(); const fm=document.getElementById('newdecform'); if(fm) fm.scrollIntoView({block:'start'}) }
  else if(a==='resetbdec'){ const k=b.dataset.k; await save(()=>DB.doc(`decs/base-${k}`).delete(),()=>{CDEC=CDEC.filter(c=>c.base!==k)}); if(editBase===k) editBase=null; flash(`D${k} reset to original text`); renderAll() }
  else if(a==='createdec'&&editBase){ const n2=val('nd-n'), A=val('nd-a'), B=val('nd-b'); if(!n2||!A||!B){flash('Add the decision and both options');return}
    const k=editBase, id='base-'+k, d={base:k,name:n2.slice(0,120),q:val('nd-q').slice(0,300),a:A.slice(0,200),b:B.slice(0,200),views:val('nd-v').slice(0,200),draft:val('nd-d').slice(0,300),editedBy:ME.id,editedAt:nowISO()};
    if(await save(()=>DB.doc(`decs/${id}`).set(d),()=>{CDEC=CDEC.filter(c=>c.id!==id); CDEC.push({...d,id})})){ editBase=null; ['nd-n','nd-q','nd-a','nd-b','nd-v','nd-d'].forEach(x=>delete drafts[x]); flash(`D${k} updated`) }
    renderAll() }
  else if(a==='editcdec'){ editBase=null; editDec=b.dataset.id; ['nd-n','nd-q','nd-a','nd-b','nd-v','nd-d'].forEach(x=>delete drafts[x]); renderAll(); const fm=document.getElementById('newdecform'); if(fm) fm.scrollIntoView({block:'start'}) }
  else if(a==='canceldec'){ editDec=null; editBase=null; ['nd-n','nd-q','nd-a','nd-b','nd-v','nd-d'].forEach(x=>delete drafts[x]); renderAll() }
  else if(a==='createdec'&&editDec){ const n2=val('nd-n'), A=val('nd-a'), B=val('nd-b'); if(!n2||!A||!B){flash('Add the decision and both options');return}
    const id=editDec, up={name:n2.slice(0,120),q:val('nd-q').slice(0,300),a:A.slice(0,200),b:B.slice(0,200),views:val('nd-v').slice(0,200),draft:val('nd-d').slice(0,300),editedBy:ME.id,editedAt:nowISO()};
    if(await save(()=>DB.doc(`decs/${id}`).update(up),()=>{Object.assign(CDEC.find(c=>c.id===id),up)})){ editDec=null; ['nd-n','nd-q','nd-a','nd-b','nd-v','nd-d'].forEach(x=>delete drafts[x]); flash('Decision updated') }
    renderAll() }
  else if(a==='createdec'){ const n2=val('nd-n'), A=val('nd-a'), B=val('nd-b'); if(!n2||!A||!B){flash('Add the decision and both options');return}
    const d={name:n2.slice(0,120),q:val('nd-q').slice(0,300),a:A.slice(0,200),b:B.slice(0,200),views:val('nd-v').slice(0,200),draft:val('nd-d').slice(0,300),by:ME.id,at:nowISO()}; let nid=null;
    const ok=await save(async()=>{const ref=await DB.collection('decs').add(d); nid=ref.id},()=>{nid=localId(); CDEC.push({...d,id:nid})});
    if(ok){ clear('nd-n','nd-q','nd-a','nd-b','nd-v','nd-d');
      if(linkAfterDec&&nid){ const tid=linkAfterDec.slice(4); await act_updateAdded(tid,{dec:{k:'c-'+nid,bMode:'hide',bTitle:''}}); sel={vid:cur.view,key:linkAfterDec}; tab='T' }
      linkAfterDec=null; flash('Decision added') }
    renderAll() }
  else if(a==='delcdec'){ const id=b.dataset.id, k='c-'+id;
    await save(async()=>{ for(const e of EDITS.filter(e=>e.dec&&e.dec.k===k)) await DB.doc(`edits/${e.id}`).update({dec:null}); if(REC[k]) await DB.doc(`decisions/D${k}`).delete(); await DB.doc(`decs/${id}`).delete() },
      ()=>{ EDITS.forEach(e=>{if(e.dec&&e.dec.k===k) e.dec=null}); delete REC[k]; CDEC=CDEC.filter(c=>c.id!==id) });
    renderAll() }
  else if(a==='moveup'||a==='movedown'){await moveBy(findView(v),sel.key,a==='moveup'?-1:1); renderAll()}
  else if(a==='resetlayout'){await save(()=>DB.doc(`layout/${v}`).delete(),()=>{delete LAYOUT[v]}); renderAll()}
});
renderAll(); initShared();
</script>
</body>
</html>
